appId: com.leaguebulkbuy.app
productName: LeagueBulkBuy
compression: maximum
directories:
  buildResources: build
files:
  # 白名单：以前是黑名单，把 CLAUDE.md、artifacts 截图、.claude 本地配置都打进了包
  - out/**
  - resources/**
  - package.json
  - node_modules/**
  # koffi 自带 18 个平台的预编译二进制，只留 Windows x64
  - '!node_modules/koffi/build/koffi/!(win32_x64)/**'
  - '!node_modules/koffi/{doc,src,vendor}/**'
afterPack: ./build/trim-locales.cjs
asarUnpack:
  - resources/**
win:
  executableName: LeagueBulkBuy
  requestedExecutionLevel: requireAdministrator
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
publish:
  provider: github
  owner: dplei
  repo: league-bulk-buy
  releaseType: release
